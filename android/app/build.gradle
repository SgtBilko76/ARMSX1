plugins {
    id 'com.android.application'
}

def repoDebugKeystore = file("debug.keystore")
def hasRepoDebugKeystore = repoDebugKeystore.exists()

android {
    namespace 'com.nanodata.armsx'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.nanodata.armsx'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 7
        versionName '0.1.6'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        if (hasRepoDebugKeystore) {
            debug {
                storeFile repoDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            matchingFallbacks = ['release']
            if (hasRepoDebugKeystore) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (hasRepoDebugKeystore) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    buildFeatures {
        buildConfig true
    }

    // phone: the regular touch/gamepad app. quest: a standalone Meta Quest APK that runs the whole
    // frontend on a curved virtual screen in an immersive OpenXR session, with the Touch controllers
    // mapped to the pad (frontend/vr). Same native library; the quest activity switches it into VR
    // mode, and only the quest APK carries the OpenXR loader.
    flavorDimensions += "device"
    productFlavors {
        phone {
            dimension "device"
            isDefault true
            buildConfigField "boolean", "QUEST_VR", "false"
        }
        quest {
            dimension "device"
            applicationIdSuffix ".quest"
            versionNameSuffix "-quest"
            buildConfigField "boolean", "QUEST_VR", "true"
            // Every Quest is arm64; keeps the loader .aar's other ABIs out of the APK.
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../third_party/SDL/android-project/app/src/main/java']
            res.srcDirs += ['src/main/res', '../../third_party/SDL/android-project/app/src/main/res']
            assets.srcDirs += ['src/main/assets']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }
}

def repoRootDir = rootProject.projectDir.parentFile
def nativeOutput = file("$projectDir/src/main/jniLibs/arm64-v8a/libarmsx.so")
def skipNativePrepare = System.getenv("ARMSX_SKIP_NATIVE_PREPARE") == "1"

tasks.register("prepareNativeBinaries") {
    group = "native"
    description = "Build SDL2/libarmsx via build.sh android."
    inputs.file(new File(repoRootDir, "build.sh"))
    outputs.file(nativeOutput)
    onlyIf { !skipNativePrepare }
    doLast {
        exec {
            workingDir repoRootDir
            commandLine "./build.sh", "android"
        }
    }
}

preBuild.dependsOn(tasks.named("prepareNativeBinaries"))

dependencies {
    // Khronos OpenXR loader: packages libopenxr_loader.so, which frontend/vr dlopen()s, and merges
    // in the OpenXR permissions and runtime-broker <queries> the loader needs.
    questImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
